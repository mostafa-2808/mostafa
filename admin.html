<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EletroPro - Painel Administrativo</title>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    
    <style>
        .admin-container { max-width: 900px; margin: 40px auto; padding: 20px; }
        .admin-card-box { background: #fff; padding: 30px; border-radius: 10px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); margin-bottom: 40px; }
        .produtos-lista-admin { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; margin-top: 20px; }
        .produto-item-admin { background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: 15px; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .produto-item-admin img { width: 100%; height: 140px; object-fit: cover; border-radius: 6px; margin-bottom: 10px; }
        .btn-action { border: none; padding: 8px 12px; border-radius: 5px; cursor: pointer; font-weight: 600; width: 100%; margin-top: 5px; color: white; }
        .btn-edit { background-color: #ffc107; color: #333; }
        .btn-edit:hover { background-color: #e0a800; }
        .btn-delete-admin { background-color: #dc3545; }
        .btn-delete-admin:hover { background-color: #b02a37; }
        /* شاشة تسجيل الدخول */
        #loginScreen {
            max-width: 400px;
            margin: 100px auto;
            background: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            text-align: center;
            
    /* تعديل الهيدر ليناسب شاشات الموبايل بكل سهولة */
    header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 15px 20px;
        background: #1e1e1e;
        color: #fff;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        box-sizing: border-box;
        z-index: 1000;
    }
    header nav ul {
        list-style: none;
        display: flex;
        gap: 15px;
        margin: 0;
        padding: 0;
        align-items: center;
    }
    header nav ul li a {
        color: #fff;
        text-decoration: none;
        font-weight: 600;
        font-size: 0.95rem;
    }

        }
    </style>
</head>
<body style="background-color: var(--bg-light); padding-top: 20px;">

    <!-- شاشة تسجيل الدخول (تظهر إذا لم يتم تسجيل الدخول) -->
    <div id="loginScreen" style="display: none;">
        <h2 style="color: var(--primary-color); margin-bottom: 20px;">🔐 Acesso Restrito</h2>
        <form onsubmit="fazerLogin(event)">
            <div style="margin-bottom: 15px; text-align: left;">
                <label style="display: block; margin-bottom: 5px; font-weight: 600;">E-mail:</label>
                <input type="email" id="loginEmail" required placeholder="seu-email@exemplo.com" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px;">
            </div>
            <div style="margin-bottom: 20px; text-align: left;">
                <label style="display: block; margin-bottom: 5px; font-weight: 600;">Senha:</label>
                <input type="password" id="loginPassword" required placeholder="********" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px;">
            </div>
            <button type="submit" class="btn-add" style="width: 100%; padding: 12px;" id="btnLogin">Entrar no Painel</button>
            <p id="loginError" style="color: #dc3545; margin-top: 15px; display: none; font-size: 0.9rem;"></p>
        </form>
    </div>

    <!-- لوحة التحكم الإدارية (تكون مخفية حتى يتم تسجيل الدخول) -->
    <div id="adminPanel" style="display: none;">
        <header>
            <a href="index.html" class="logo">⚡ EletroPro - Admin</a>
            <nav>
                <ul>
                    <li><a href="index.html">Ver Site 🌐</a></li>
                    <li><a href="#" onclick="fazerLogout()" style="color: #ffcccc;">Sair 🚪</a></li>
                </ul>
            </nav>
        </header>

        <div class="admin-container" style="margin-top: 100px;">
            
            <!-- نموذج الإضافة أو التعديل -->
            <div class="admin-card-box">
                <h2 id="formTitle" class="section-title" style="font-size: 1.6rem; margin-bottom: 20px; text-align: left;">➕ Adicionar Novo Produto</h2>
                
                <form id="adminProductForm" onsubmit="salvarProduto(event)">
                    <input type="hidden" id="produtoId">

                    <div style="margin-bottom: 15px; text-align: left;">
                        <label style="display: block; margin-bottom: 5px; font-weight: 600;">Nome do Produto:</label>
                        <input type="text" id="nome" required placeholder="Ex: Furadeira Profissional" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px;">
                    </div>

                    <div style="margin-bottom: 15px; text-align: left;">
                        <label style="display: block; margin-bottom: 5px; font-weight: 600;">Preço (R$):</label>
                        <input type="number" step="0.01" id="preco" required placeholder="Ex: 299.99" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px;">
                    </div>

                    <div style="margin-bottom: 15px; text-align: left;">
                        <label style="display: block; margin-bottom: 5px; font-weight: 600;">URL da Imagem:</label>
                        <input type="url" id="imagem" required placeholder="https://..." style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px;">
                    </div>

                    <div style="margin-bottom: 20px; text-align: left;">
                        <label style="display: block; margin-bottom: 5px; font-weight: 600;">Descrição:</label>
                        <textarea id="descricao" rows="2" placeholder="Detalhes rápidos..." style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px;"></textarea>
                    </div>

                    <button type="submit" class="btn-add" style="width: 100%; padding: 12px;" id="btnSalvar">Salvar Produto</button>
                    <button type="button" id="btnCancelar" onclick="limparFormulario()" style="width: 100%; padding: 10px; margin-top: 10px; background: #6c757d; color: white; border: none; border-radius: 5px; display: none; cursor: pointer;">Cancelar Edição</button>
                </form>

                <div id="msgSucesso" style="display: none; margin-top: 15px; padding: 10px; background-color: #d4edda; color: #155724; border-radius: 5px; text-align: center; font-weight: bold;">
                    ✅ Operação realizada com sucesso!
                </div>
            </div>

            <!-- قائمة المنتجات وإدارتها -->
            <div class="admin-card-box">
                <h2 class="section-title" style="font-size: 1.6rem; margin-bottom: 20px; text-align: left;">📦 Produtos Cadastrados</h2>
                <div id="adminProdutosGrid" class="produtos-lista-admin"></div>
            </div>

        </div>
    </div>

    <!-- Supabase JS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <script>
        const SUPABASE_URL = 'https://qjtqbtxagdzfyaixnfso.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFqdHFidHhhZ2R6ZnlhaXhuZnNvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAyNzg1ODksImV4cCI6MjEwNTg1NDU4OX0.H2CDch43Bj6F3FKVPjLuAjXeFBEzRUDEt3fkYCEiJTc';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // التحقق من الجلسة عند فتح الصفحة
        async function verificarSessao() {
            const { data: { session } } = await _supabase.auth.getSession();
            if (session) {
                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('adminPanel').style.display = 'block';
                carregarProdutosAdmin();
            } else {
                document.getElementById('loginScreen').style.display = 'block';
                document.getElementById('adminPanel').style.display = 'none';
            }
        }

        // تسجيل الدخول
        async function fazerLogin(event) {
            event.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            const errorMsg = document.getElementById('loginError');
            const btn = document.getElementById('btnLogin');

            btn.innerText = 'Entrando...';
            btn.disabled = true;

            const { data, error } = await _supabase.auth.signInWithPassword({
                email: email,
                password: password,
            });

            if (error) {
                errorMsg.innerText = 'Erro: E-mail ou senha incorretos.';
                errorMsg.style.display = 'block';
                btn.innerText = 'Entrar no Painel';
                btn.disabled = false;
            } else {
                verificarSessao();
            }
        }

        // تسجيل الخروج
        async function fazerLogout() {
            await _supabase.auth.signOut();
            verificarSessao();
        }

        async function carregarProdutosAdmin() {
            const { data: produtors, error } = await _supabase
                .from('produtors')
                .select('*')
                .order('id', { ascending: true });

            const grid = document.getElementById('adminProdutosGrid');
            grid.innerHTML = '';

            if (error || !produtors || produtors.length === 0) {
                grid.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: #666;">Nenhum produto cadastrado.</p>';
                return;
            }

            produtors.forEach(produto => {
                grid.innerHTML += `
                    <div class="produto-item-admin">
                        <img src="${produto.imagem}" alt="${produto.nome}" onerror="this.src='https://via.placeholder.com/150'">
                        <h4 style="font-size: 1rem; margin-bottom: 5px;">${produto.nome}</h4>
                        <p style="color: var(--primary-color); font-weight: bold; margin-bottom: 10px;">R$ ${Number(produto.preco).toFixed(2)}</p>
                        <button class="btn-action btn-edit" onclick="preencherEdicao(${produto.id}, '${produto.nome}', ${produto.preco}, '${produto.imagem}', '${produto.descricao || ''}')">✏️ Editar</button>
                        <button class="btn-action btn-delete-admin" onclick="deletarProduto(${produto.id})">🗑️ Excluir</button>
                    </div>
                `;
            });
        }

        function preencherEdicao(id, nome, preco, imagem, descricao) {
            document.getElementById('produtoId').value = id;
            document.getElementById('nome').value = nome;
            document.getElementById('preco').value = preco;
            document.getElementById('imagem').value = imagem;
            document.getElementById('descricao').value = descricao;

            document.getElementById('formTitle').innerText = '✏️ Editar Produto';
            document.getElementById('btnSalvar').innerText = 'Atualizar Alterações';
            document.getElementById('btnCancelar').style.display = 'block';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function limparFormulario() {
            document.getElementById('adminProductForm').reset();
            document.getElementById('produtoId').value = '';
            document.getElementById('formTitle').innerText = '➕ Adicionar Novo Produto';
            document.getElementById('btnSalvar').innerText = 'Salvar Produto';
            document.getElementById('btnCancelar').style.display = 'none';
        }

        async function salvarProduto(event) {
            event.preventDefault();
            const id = document.getElementById('produtoId').value;
            const nome = document.getElementById('nome').value;
            const preco = parseFloat(document.getElementById('preco').value);
            const imagem = document.getElementById('imagem').value;
            const descricao = document.getElementById('descricao').value;

            let error;

            if (id) {
                const response = await _supabase
                    .from('produtors')
                    .update({ nome, preco, imagem, descricao })
                    .eq('id', id);
                error = response.error;
            } else {
                const response = await _supabase
                    .from('produtors')
                    .insert([{ nome, preco, imagem, descricao }]);
                error = response.error;
            }

            if (error) {
                alert('Erro: ' + error.message);
            } else {
                document.getElementById('msgSucesso').style.display = 'block';
                limparFormulario();
                carregarProdutosAdmin();
                setTimeout(() => document.getElementById('msgSucesso').style.display = 'none', 3000);
            }
        }

        async function deletarProduto(id) {
            if (!confirm('Tem certeza que deseja excluir?')) return;
            const { error } = await _supabase.from('produtors').delete().eq('id', id);
            if (error) alert('Erro: ' + error.message);
            else carregarProdutosAdmin();
        }

        // فحص الجلسة فور تحميل الصفحة
        document.addEventListener('DOMContentLoaded', verificarSessao);
    </script>
</body>
</html>
